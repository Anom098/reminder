org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
# Kotlin's incremental compiler cannot relativise paths across Windows drive
# letters. When the project lives on one drive and the pub cache on another
# (E:\ project, C:\Users\...\Pub\Cache here), plugin compilation dies inside
# RelocatableFileToPathConverter with a PersistentMap crash that surfaces only
# as a bare "Compilation error". Full recompiles are slower but correct.
kotlin.incremental=false

android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
