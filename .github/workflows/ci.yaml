name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.27.1"

jobs:
  analyse:
    name: Analyse and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        # Drift's generated sources are not checked in; nothing compiles
        # without this step.
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyse
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests with coverage
        run: flutter test --coverage --reporter expanded

      - name: Strip generated code from coverage
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lcov
          lcov --remove coverage/lcov.info \
            '*/*.g.dart' \
            '*/*.freezed.dart' \
            --output-file coverage/lcov.info \
            --ignore-errors unused

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: analyse
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Materialise generated platform files
        # The Xcode project, Gradle wrapper and launcher icons are not checked
        # in; this fills in only what is missing.
        run: bash tool/bootstrap.sh --skip-pub-get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        # Release builds are unsigned here: key.properties is absent on CI and
        # android/app/build.gradle falls back to the debug signing config.
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: analyse
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Materialise generated platform files
        run: bash tool/bootstrap.sh --skip-pub-get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (unsigned)
        # Signing requires certificates that do not belong in CI secrets for an
        # open build; --no-codesign still catches compile and CocoaPods errors.
        run: flutter build ios --release --no-codesign
